name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check server readiness without updating code, installing, migrating, or reloading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renome-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.preflight_only == true || vars.PROD_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate deployment script
        run: |
          bash -n scripts/deploy-production.sh
          bash tests/deployment/production.sh

      - name: Connect and deploy
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_FPM_SERVICE: ${{ vars.PROD_FPM_SERVICE }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${PROD_HOST:?Missing PROD_HOST}"
          : "${PROD_USER:?Missing PROD_USER}"
          : "${PROD_SSH_KEY_B64:?Missing PROD_SSH_KEY_B64}"
          : "${PROD_KNOWN_HOSTS:?Missing PROD_KNOWN_HOSTS}"
          : "${PROD_FPM_SERVICE:?Set PROD_FPM_SERVICE after verifying the server unit}"
          port=${PROD_PORT:-22}
          [[ "$PROD_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( 10#$port > 0 && 10#$port <= 65535 ))
          [[ "$PROD_FPM_SERVICE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/renome-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s' "$PROD_SSH_KEY_B64" | base64 --decode > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null
          mode=deploy
          if [[ "$PREFLIGHT_ONLY" == true ]]; then mode=preflight; fi
          ssh -T -p "$port" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$PROD_USER@$PROD_HOST" \
            "bash -s -- $mode $PROD_FPM_SERVICE $GITHUB_SHA" < scripts/deploy-production.sh
